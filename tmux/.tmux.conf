set-option -g prefix C-b
bind-key R source-file ~/.tmux.conf \; display-message "config reloaded"
set -g mouse on

bind-key C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-r display-popup -E '$SHELL'
bind-key v split-window -h
bind-key h split-window -v

bind -n M-H previous-window
bind -n M-L next-window

bind-key T command-prompt -I "#{window_name}" "rename-window '%%'"
bind-key y set-window-option synchronize-panes \; display-message "Sync toggled"

# Status Bar
set -g status-justify centre
set -g status-position top
set -g status-bg black
set -g status-fg white
set -g status-right ''
set -g base-index 1
set-option -g status-interval 1
set-window-option -g automatic-rename
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'
set-window-option -g pane-base-index 1
setw -g monitor-activity off
setw -g monitor-silence 0
set -g window-status-activity-style fg=blue,bg=black
set -g window-status-current-style fg=green,bg=black
set -g window-status-current-format " #I:#W "
set -g window-status-format " #I:#W "
set -g monitor-bell on
set -g window-status-bell-style fg=black,bg=green
setw -g mode-keys vi
set -g set-clipboard on
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
set-option -g default-terminal "${TERM}"
set-option -g focus-events on
set -g status-style bg=default
set -g status-left-length 99
set -g status-right-length 99

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h'  'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j'  'select-pane -D'
bind-key -n 'M-k' if-shell "$is_vim" 'send-keys M-k'  'select-pane -U'
bind-key -n 'M-l' if-shell "$is_vim" 'send-keys M-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-j' select-pane -D
bind-key -T copy-mode-vi 'M-k' select-pane -U
bind-key -T copy-mode-vi 'M-l' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l
