onboarding = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
prefix = "ctrl+b"
help = "prefix+?"
settings = "prefix+."
new_worktree = "prefix+shift+g"
new_workspace = "prefix+ctrl+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+w"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+o"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
goto = "prefix+s"
previous_agent = "prefix+shift+h"
next_agent = "prefix+shift+l"
focus_agent = "prefix+alt+1..9"
remote_image_paste = "ctrl+v"
new_tab = "prefix+c"
previous_tab = "alt+h"
next_tab = "alt+l"
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"
rename_pane = "prefix+t"
edit_scrollback = "prefix+e"
copy_mode = "prefix+["
switch_workspace = "prefix+shift+1..9"
focus_pane_left = "alt+shift+h"
focus_pane_right = "alt+shift+l"
focus_pane_down = "alt+shift+j"
focus_pane_up = "alt+shift+k"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
split_vertical = "prefix+%"
split_horizontal = "prefix+\""
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+shift+z"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "zsh shell instance"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "yazi"
description = "yazi"
width = "80%"
height = "80%"

[theme]
name = "catppuccin"
auto_switch = false
dark_name = "catppuccin"
light_name = "gruvbox-light"

# [theme.custom]
# accent = "#ABC4AB"
# panel_bg = "#000001"
# surface0 = "#61E294"
# surface1 = "#DCC9B6"

[ui]
sidebar_width = 26
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
mobile_width_threshold = 64
show_agent_labels_on_pane_borders = true
copy_on_select = true
mouse_capture = true
host_cursor = "native"
right_click_passthrough_modifier = "alt"
redraw_on_focus_gained = true
agent_panel_sort = "priority"
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = true
accent = "cyan"

[ui.toast]
delivery = "system"
delay_seconds = 1
herdr.position = "bottom-left"
clipboard.enabled = true
clipboard.position = "bottom-center"

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent"]]
rows_by_agent = {}

[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sound]
enabled = true
agents.pi = "on"
agents.claude = "on"
agents.codex = "on"
agents.gemini = "on"
agents.cursor = "on"
agents.devin = "on"
agents.agy = "on"
agents.cline = "on"
agents.open_code = "on"
agents.github_copilot = "on"
agents.kimi = "on"
agents.kiro = "on"
agents.droid = "on"
agents.amp = "on"
agents.grok = "on"
agents.hermes = "on"
agents.kilo = "on"
agents.qodercli = "on"
agents.maki = "on"

[session]
resume_agents_on_restore = true

[worktrees]
directory = "~/.herdr/worktrees"

[remote]
manage_ssh_config = true

[advanced]
scrollback_limit_bytes = 10000000

[experimental]
allow_nested = false
kitty_graphics = true
pane_history = true
reveal_hidden_cursor_for_cjk_ime = false
cjk_ime_agents = []
cjk_ime_cursor_shape = "steady_block"
switch_ascii_input_source_in_prefix = false
